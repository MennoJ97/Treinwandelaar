<!doctype html>
<html lang="nl" data-site="treinwandelaar">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- What every mhjansen.nl site shares: greys, type, and the light/dark switch. family.js
		     is blocking, straight after the stylesheet, so a saved dark choice never flashes light. -->
		<link rel="stylesheet" href="https://mhjansen.nl/family.css" />
		<script src="https://mhjansen.nl/family.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
